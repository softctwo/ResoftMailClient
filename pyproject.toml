[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ResoftMailClient"
version = "0.1.0"
description = "ResoftMailClient for Exchange ActiveSync mail sync, digest, and sending"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["eas_client*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
